name: Publicar agente

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir versao da tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "version = \"${VERSION}\"" main.go || { echo "main.go nao esta na versao ${VERSION}"; exit 1; }
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.13"

      - name: Compilar agente (nomes no formato esperado pela API)
        run: |
          mkdir -p dist
          build() {
            local os="$1" arch="$2" ext="$3"
            env CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "dist/tacticalagent-v${VERSION}-${os}-${arch}${ext}"
          }
          for arch in amd64 386 arm64 arm; do build linux "$arch" ""; done
          for arch in amd64 386; do build windows "$arch" ".exe"; done
          for arch in amd64 arm64; do build darwin "$arch" ""; done

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compilar app de bandeja para Windows
        working-directory: tray
        run: |
          (cd frontend && npm ci && npm run build)
          env CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H=windowsgui" \
            -o "../dist/wincare-tray-v${VERSION}-windows-amd64.exe"

      - name: Somas SHA-256
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Agente WinCare ${GITHUB_REF_NAME}" \
            --notes "Agente ${VERSION} (Linux, Windows e macOS) e app de bandeja para Windows. Somas em SHA256SUMS.txt."
